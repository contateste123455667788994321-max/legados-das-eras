name: Testar jogo e montar APK de teste

on:
  push:
    branches: [main, arte-e-progressao-v3]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: legados-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validar:
    name: Validar Godot e simulação
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Importar projeto e detectar erros
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --path . --import 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:.*(Parse|script|Script)' godot-import.log; then
            echo "Erros de script encontrados no projeto."
            exit 1
          fi
      - name: Testar simulação e salvamento
        shell: bash
        run: |
          set -eo pipefail
          timeout --kill-after=15s 5m godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee godot-test.log
          grep -q 'SUCESSO: todos os testes basicos passaram.' godot-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|FALHOU:|ERROR:.*Invalid' godot-test.log; then
            echo "Falha na validacao da simulacao."
            exit 1
          fi
      - name: Salvar logs se houver erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-godot
          path: |
            godot-import.log
            godot-test.log
          if-no-files-found: ignore

  avaliar_jogadores:
    name: "Jogador exigente: ${{ matrix.profile }}"
    needs: validar
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        profile: [observer, builder, explorer, chaos, historian, diplomat, ecologist, survivor, artist, impatient]
    steps:
      - uses: actions/checkout@v4
      - name: Importar recursos e personagens
        shell: bash
        run: godot --headless --path . --import
      - name: Simular jogador
        shell: bash
        run: |
          set -eo pipefail
          timeout --kill-after=15s 12m godot --headless --path . --script res://tests/player_scenarios.gd -- "${{ matrix.profile }}" 2>&1 | tee player-test.log
          grep -q 'SUCESSO: jogador' player-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|FALHOU:|JOGADOR SIMULADO:|ERROR:.*Invalid' player-test.log; then
            echo "Erro no perfil de jogador ${{ matrix.profile }}"
            exit 1
          fi
      - name: Anexar erros para diagnostico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "erros-jogador-${{ matrix.profile }}"
          path: player-test.log
          if-no-files-found: ignore

  apk_teste:
    name: Gerar APK Android (não é versão final)
    needs: [validar, avaliar_jogadores]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Importar arquivos
        run: HOME=/root godot --headless --path . --import
      - name: Exportar APK de depuração
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build
          HOME=/root godot --headless --path . --export-debug "Android" build/Legado-das-Eras-debug.apk 2>&1 | tee godot-export.log
          test -s build/Legado-das-Eras-debug.apk
      - name: Gerar pacote de atualizacao interna (PCK)
        shell: bash
        run: |
          set -eo pipefail
          HOME=/root godot --headless --path . --export-pack "Android" build/Legado-das-Eras-conteudo.pck 2>&1 | tee godot-pack.log
          test -s build/Legado-das-Eras-conteudo.pck
          sha256sum build/Legado-das-Eras-conteudo.pck > build/sha256-conteudo.txt
          stat -c '%s bytes' build/Legado-das-Eras-conteudo.pck >> build/sha256-conteudo.txt
      - name: Guardar pacote de conteudo experimental
        uses: actions/upload-artifact@v4
        with:
          name: legado-das-eras-pck-teste
          path: |
            build/Legado-das-Eras-conteudo.pck
            build/sha256-conteudo.txt
          if-no-files-found: error
          retention-days: 30
      - name: Guardar APK para testes
        uses: actions/upload-artifact@v4
        with:
          name: legado-das-eras-apk-teste
          path: build/Legado-das-Eras-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Guardar log se a exportação falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-exportacao-android
          path: godot-export.log
          if-no-files-found: ignore

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Publicar atualizacao validada
    needs: apk_teste
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: legado-das-eras-pck-teste
          path: build
      - name: Publicar pacote e manifesto gratuitos
        shell: bash
        run: |
          set -eo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p updates
          cp build/Legado-das-Eras-conteudo.pck updates/
          python3 - <<'PY'
          import json, hashlib, pathlib
          p = pathlib.Path("updates/Legado-das-Eras-conteudo.pck")
          m = json.loads(pathlib.Path("manifest.json").read_text())
          m.update(version_code=int(m["version_code"])+1, version_name="0.5."+str(int(m["version_code"])-4), pack_format="pck", pack_url="https://raw.githubusercontent.com/contateste123455667788994321-max/legados-das-eras/main/"+str(p), pack_sha256=hashlib.sha256(p.read_bytes()).hexdigest(), pack_pck_sha256=hashlib.sha256(p.read_bytes()).hexdigest(), pack_bytes=p.stat().st_size)
          pathlib.Path("manifest.json").write_text(json.dumps(m, indent=2)+"\n")
          PY
          git add -f updates/Legado-das-Eras-conteudo.pck manifest.json
          git commit -m "Publish validated in-game update"
          git push origin HEAD:main
